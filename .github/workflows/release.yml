name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag to release (e.g. v0.1.2)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: web

      - name: Build frontend
        run: npm run build
        working-directory: web

      - name: Run Go tests
        run: go test ./... -count=1

      - name: Run Go vet
        run: go vet ./cmd/... ./internal/... ./web/...

  build:
    name: Build
    needs: [validate]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build frontend
        run: npm ci && npm run build
        working-directory: web

      - name: Build release binaries
        run: |
          mkdir -p dist
          GOOS=linux GOARCH=amd64 go build -o dist/glyphdeck-linux-amd64 ./cmd/glyphdeck
          GOOS=darwin GOARCH=amd64 go build -o dist/glyphdeck-darwin-amd64 ./cmd/glyphdeck
          GOOS=darwin GOARCH=arm64 go build -o dist/glyphdeck-darwin-arm64 ./cmd/glyphdeck
          GOOS=windows GOARCH=amd64 go build -o dist/glyphdeck-windows-amd64.exe ./cmd/glyphdeck

      - name: Generate checksums
        run: |
          cd dist
          sha256sum \
            glyphdeck-linux-amd64 \
            glyphdeck-darwin-amd64 \
            glyphdeck-darwin-arm64 \
            glyphdeck-windows-amd64.exe \
            > checksums.txt
          cat checksums.txt

      - name: Generate SBOM
        run: |
          mkdir -p dist
          curl -sSfL "https://github.com/CycloneDX/cyclonedx-gomod/releases/download/v1.10.0/cyclonedx-gomod_1.10.0_linux_amd64.tar.gz" -o cyclonedx-gomod.tar.gz
          tar xzf cyclonedx-gomod.tar.gz
          ./cyclonedx-gomod mod -licenses -json -output "dist/glyphdeck-${{ env.RELEASE_TAG }}.cdx.json"

      - name: Attest provenance for release binaries
        id: attest-provenance
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-checksums: dist/checksums.txt

      - name: Copy provenance bundle
        run: |
          BUNDLE="${{ steps.attest-provenance.outputs.bundle-path }}"
          if [ ! -f "$BUNDLE" ] || [ ! -s "$BUNDLE" ]; then
            echo "Provenance bundle is missing or empty"
            exit 1
          fi
          cp "$BUNDLE" "dist/glyphdeck-${{ env.RELEASE_TAG }}.provenance.sigstore.json"

      - name: Attest SBOM for release binaries
        id: attest-sbom
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-checksums: dist/checksums.txt
          sbom-path: "dist/glyphdeck-${{ env.RELEASE_TAG }}.cdx.json"

      - name: Copy SBOM bundle
        run: |
          BUNDLE="${{ steps.attest-sbom.outputs.bundle-path }}"
          if [ ! -f "$BUNDLE" ] || [ ! -s "$BUNDLE" ]; then
            echo "SBOM bundle is missing or empty"
            exit 1
          fi
          cp "$BUNDLE" "dist/glyphdeck-${{ env.RELEASE_TAG }}.sbom.sigstore.json"

      - name: Create Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            dist/*
          generate_release_notes: true
